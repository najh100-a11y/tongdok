<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>진실한숲 통독</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="진숲 통독">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<style>
/* One reading column, 640px at most, left-aligned. Everything meant to be read is
   set in the serif; dates, buttons and labels are set in the sans. One accent (leaf)
   marks what the reader acts on: today, the key verse, footnotes, 읽었어요. */
@font-face{font-family:"RIDIBatang";src:url("fonts/RIDIBatang.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Regular.subset.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Medium.subset.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-SemiBold.subset.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}

:root{
  --paper:#F5F7F2;
  --surface:#FFFFFF;
  --ink:#17201B;
  --ink-soft:#57625B;
  --rule:#DADFD6;
  --leaf:#2C5E47;
  --leaf-wash:#E2ECE3;
  --on-leaf:#FFFFFF;
  --font-read:"RIDIBatang","Noto Serif KR","AppleMyungjo","Batang",serif;
  --font-ui:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --read:1.0625rem;
  --gutter:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111613;--surface:#181E1A;--ink:#E4EAE4;--ink-soft:#9CA79F;--rule:#2A332D;
    --leaf:#8FC7A8;--leaf-wash:#1D2A22;--on-leaf:#0F1612;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111613;--surface:#181E1A;--ink:#E4EAE4;--ink-soft:#9CA79F;--rule:#2A332D;
  --leaf:#8FC7A8;--leaf-wash:#1D2A22;--on-leaf:#0F1612;color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:4px;padding:10px 12px 6px}
.top .date{flex:1;text-align:center;font-weight:600;font-size:1rem;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:12px;color:var(--ink)}
.icon-btn:disabled{opacity:.28;cursor:default}
.icon-btn svg{width:20px;height:20px}
.size-btn{display:block;width:48px;line-height:44px;text-align:center;white-space:nowrap;font-family:var(--font-read)}
.size-btn .a{font-size:.8125rem}
.size-btn .b{font-size:1.1875rem;margin-left:1px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 var(--gutter) 14px;border-bottom:1px solid var(--rule)}
.day{display:grid;justify-items:center;gap:1px;padding:7px 0 6px;border:1px solid transparent;border-radius:12px;background:none;min-width:0}
.day .w{font-size:.6875rem;color:var(--ink-soft)}
.day .d{font-size:.9375rem;font-weight:500;font-variant-numeric:tabular-nums}
.day .dot{width:5px;height:5px;border-radius:50%;margin-top:2px;background:transparent}
.day.is-read .dot{background:var(--leaf)}
.day.is-current{background:var(--surface);border-color:var(--rule)}
.day.is-current .d{color:var(--leaf);font-weight:600}
.day.is-rest .d{color:var(--ink-soft)}
.day:disabled{opacity:.3;cursor:default}

/* reading column */
main{flex:1;padding:0 var(--gutter)}
main>section{padding:28px 0}
main>section+section{border-top:1px solid var(--rule)}
.label{margin:0 0 12px;font-size:.8125rem;font-weight:600;color:var(--ink-soft);letter-spacing:0}
.read{font-family:var(--font-read);font-synthesis:none;font-size:var(--read);line-height:1.9;letter-spacing:-0.01em;word-break:keep-all;overflow-wrap:break-word}
.read p{margin:0 0 .9em}
.read p:last-child{margin-bottom:0}

.hero{padding-top:26px}
.hero .section-name{margin:0 0 6px;font-size:.875rem;color:var(--ink-soft)}
.hero h1{margin:0;font-family:var(--font-read);font-synthesis:none;font-weight:400;font-size:clamp(1.9rem,7.4vw,2.5rem);line-height:1.25;letter-spacing:-0.02em;word-break:keep-all;text-wrap:balance}
.progress{display:flex;align-items:center;gap:12px;margin-top:18px}
.progress .bar{flex:1;height:3px;border-radius:2px;background:var(--rule);overflow:hidden}
.progress .bar i{display:block;height:100%;min-width:3px;background:var(--leaf)}
.progress span{font-size:.8125rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.refs{margin:16px 0 0;font-size:.8125rem;line-height:1.7;color:var(--ink-soft);word-break:keep-all}
.refs i{font-style:normal}
.guide h2{margin:0 0 14px;font-family:var(--font-read);font-synthesis:none;font-weight:400;font-size:1.4375rem;line-height:1.4;letter-spacing:-0.015em;word-break:keep-all;text-wrap:balance}

/* scripture */
.scripture-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.scripture-head .label{margin:0}
.scripture-head .ver{font-size:.8125rem;color:var(--ink-soft)}
.invite{margin:12px 0 0;padding:16px 18px;border:1px solid var(--rule);border-radius:16px;background:var(--surface)}
.invite .lead{margin:0;font-family:var(--font-read);font-synthesis:none;font-size:var(--read);line-height:1.75;letter-spacing:-0.01em;word-break:keep-all}
.invite .sub{margin:6px 0 0;font-size:.8125rem;line-height:1.6;color:var(--ink-soft);word-break:keep-all}
.text-btn{margin-top:12px;min-height:40px;padding:0 16px;border:1px solid var(--leaf);border-radius:12px;background:none;font-size:.875rem;font-weight:600;color:var(--leaf)}
.text-btn[aria-expanded="true"]{border-color:var(--rule);color:var(--ink-soft)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tab{min-height:36px;padding:0 15px;border:1px solid var(--rule);border-radius:999px;background:none;font-size:.875rem;font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-wash);color:var(--leaf)}
.passage{padding-top:20px;min-height:9rem}
.passage h3{margin:0 0 10px;font-family:var(--font-read);font-synthesis:none;font-weight:400;font-size:1.1875rem;letter-spacing:-0.01em}
.passage h3:focus{outline:none}
.pb .para{margin:0 0 .9em}
.pb .pi{padding-left:1.2em}
.pb .sh{margin:1.5em 0 .45em;font-family:var(--font-ui);font-size:.875rem;font-weight:600;line-height:1.5;color:var(--ink);letter-spacing:-0.01em;word-break:keep-all}
.pb .sh:first-child{margin-top:.2em}
.pb .r{margin:-.2em 0 .6em;font-family:var(--font-ui);font-size:.8125rem;color:var(--ink-soft)}
.pb .d{margin:0 0 .7em;font-size:.9375em;color:var(--ink-soft)}
.pb .q{margin:0 0 .12em;padding-left:1.4em;text-indent:-1.4em}
.pb .q2{padding-left:2.8em}
.pb .q3{padding-left:4.2em}
.pb .q+.para,.pb .q+.sh,.pb .para+.q,.pb .d+.q{margin-top:.75em}
.pb .b{height:.75em}
.vn{position:relative;top:-.48em;margin:0 .22em 0 .06em;font-family:var(--font-ui);font-size:.62em;font-weight:500;line-height:0;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.fn{position:relative;top:-.48em;margin:0 .1em;padding:0 .14em;border:0;background:none;font-family:var(--font-ui);font-size:.62em;font-weight:600;line-height:1;color:var(--leaf);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.fn::after{content:"";position:absolute;inset:-12px -8px}
.fn[aria-expanded="true"]{text-decoration:none;background:var(--leaf-wash);border-radius:3px}
.note{margin:-.35em 0 .9em;padding:10px 14px;border-radius:12px;background:var(--leaf-wash);font-family:var(--font-ui);font-size:.875rem;line-height:1.65;color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
.note b{margin-right:.45em;font-weight:600;color:var(--leaf);font-variant-numeric:tabular-nums}
.kv{background:var(--leaf-wash);border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.next-ch{width:100%;min-height:48px;margin-top:20px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);font-size:.9375rem;font-weight:600;color:var(--leaf)}
.attrib{margin-top:24px;padding-top:14px;border-top:1px solid var(--rule);font-size:.75rem;line-height:1.7;color:var(--ink-soft)}
.attrib p{margin:0}
.attrib a{color:var(--leaf);text-underline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px}
.links a{display:inline-block;padding:4px 0;font-size:.875rem;color:var(--leaf);text-underline-offset:3px}
.state{margin:6px 0 0;font-size:.9375rem;line-height:1.65;color:var(--ink-soft);word-break:keep-all}
.state .btn{margin-top:12px}

.key blockquote{margin:0;padding:2px 0 2px 16px;border-left:2px solid var(--leaf)}
.key cite{display:block;margin-top:10px;font-family:var(--font-ui);font-style:normal;font-size:.8125rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.key .go{margin-top:12px}

.extra h3{margin:0 0 8px;font-family:var(--font-read);font-synthesis:none;font-weight:400;font-size:1.125rem}
.extra .src{margin-top:12px;font-size:.8125rem;line-height:1.7;color:var(--ink-soft)}
.extra .src a{color:inherit;text-underline-offset:3px}

/* writing areas */
.write textarea{display:block;width:100%;min-height:92px;padding:12px 14px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);resize:vertical;font-size:1rem;line-height:1.6}
.write textarea::placeholder{color:var(--ink-soft)}
.write .row{display:flex;justify-content:flex-end;margin-top:10px}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--leaf);border-radius:12px;background:none;color:var(--leaf);font-size:.9375rem;font-weight:600}
.posts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.posts li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--leaf-wash)}
.posts p{flex:1;margin:0;font-size:.9375rem;line-height:1.65;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.posts button{border:0;background:none;padding:2px 0;font-size:.8125rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.hint{margin:10px 0 0;font-size:.8125rem;color:var(--ink-soft);word-break:keep-all}

/* shared posts */
.posts li.post{display:block;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--rule)}
.posts li.empty{display:block;padding:4px 0;background:none;font-size:.875rem;color:var(--ink-soft)}
.post .meta{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-size:.8125rem;color:var(--ink-soft)}
.post .meta b{font-weight:600;color:var(--ink)}
.post .body{margin:0;font-family:var(--font-read);font-synthesis:none;font-size:var(--read);line-height:1.75;letter-spacing:-0.01em;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.post .acts{display:flex;gap:16px;margin-top:8px}
.post .acts button,.reply button.del{min-height:32px;border:0;background:none;padding:0;font-size:.8125rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.post .acts button.warn,.reply button.warn{color:#A1422F}
.replies{margin:10px 0 0;padding:10px 0 0 12px;border-left:2px solid var(--leaf-wash)}
.replies ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reply .meta{margin-bottom:2px}
.reply p{margin:0;font-size:.9375rem;line-height:1.65;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.replies form{margin-top:10px}
.replies textarea{min-height:64px}
.together{margin:10px 0 0;font-size:.8125rem;color:var(--leaf);font-weight:500}

/* sign-in, join, account */
.gate{padding:16px 18px;border:1px solid var(--rule);border-radius:16px;background:var(--surface)}
.gate .lead{margin:0 0 12px;font-size:.9375rem;line-height:1.65;word-break:keep-all}
.kakao-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:0;border-radius:12px;background:#FEE500;color:rgba(0,0,0,.85);font-size:1rem;font-weight:600}
.kakao-btn svg{width:18px;height:18px}
.field{display:grid;gap:6px;margin:0 0 14px}
.field label{font-size:.8125rem;font-weight:600;color:var(--ink-soft)}
.field input{width:100%;height:46px;padding:0 14px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);font:inherit;font-size:1rem;color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px;font-size:.875rem;line-height:1.6;word-break:keep-all}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--leaf);flex:none}
.privacy{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--leaf-wash);font-size:.8125rem;line-height:1.7;word-break:keep-all}
.privacy p{margin:0 0 4px}
.privacy p:last-child{margin:0}
.solid{width:100%;min-height:48px;border:1px solid var(--leaf);border-radius:12px;background:var(--leaf);color:var(--on-leaf);font-size:1rem;font-weight:600}
.msg{margin:10px 0 0;font-size:.875rem;line-height:1.6;color:#A1422F;word-break:keep-all}
.msg.ok{color:var(--leaf)}
.acct-actions{display:flex;flex-wrap:wrap;gap:10px}
.member-list{list-style:none;margin:0;padding:0}
.member-list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.member-list li:last-child{border-bottom:0}
.member-list .n{flex:1;font-size:.9375rem}
.member-list .s{font-size:.75rem;color:var(--ink-soft)}
.member-list button{min-height:36px;padding:0 12px;border:1px solid var(--rule);border-radius:10px;background:none;font-size:.8125rem}
/* intro */
.intro{max-width:30rem;padding:64px 0 48px}
.intro .mark{display:block;width:56px;height:56px;border-radius:14px;margin:0 0 28px}
.intro .kicker{margin:0 0 10px;font-size:.875rem;color:var(--ink-soft)}
.intro h1{margin:0 0 18px;font-family:var(--font-read);font-synthesis:none;font-weight:400;font-size:clamp(1.95rem,7.8vw,2.6rem);line-height:1.3;letter-spacing:-0.02em;word-break:keep-all;text-wrap:balance}
.intro .lede{margin:0 0 32px;font-family:var(--font-read);font-synthesis:none;font-size:1.0625rem;line-height:1.85;word-break:keep-all}
.intro .fine{margin:12px 0 0;font-size:.8125rem;line-height:1.6;color:var(--ink-soft);word-break:keep-all}
.intro .quiet{display:inline-block;margin-top:14px;min-height:40px;padding:0;border:0;background:none;font-size:.875rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.install-mini{margin-top:36px;padding-top:6px;border-top:1px solid var(--rule)}
.install-mini summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;cursor:pointer;font-size:.9375rem;list-style:none}
.install-mini summary::-webkit-details-marker{display:none}
.install-mini summary::after{content:"";width:8px;height:8px;margin-right:4px;border-right:1.6px solid var(--ink-soft);border-bottom:1.6px solid var(--ink-soft);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.install-mini[open] summary::after{transform:rotate(225deg) translateY(-2px)}
.install-mini .install{margin:4px 0 0}
@media (prefers-reduced-motion:reduce){.install-mini summary::after{transition:none}}

/* install guide */
.install{margin:18px 0 0;padding:16px 18px;border:1px solid var(--rule);border-radius:16px;background:var(--surface)}
.install .lead{margin:0 0 12px;font-size:.9375rem;line-height:1.65;word-break:keep-all}
.install .head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.install .head img{width:40px;height:40px;border-radius:10px;flex:none}
.install .head b{display:block;font-size:1rem;font-weight:600}
.install .head span{display:block;font-size:.8125rem;color:var(--ink-soft);word-break:keep-all}
.install ol{margin:0 0 4px;padding-left:1.3em;font-size:.9375rem;line-height:1.7;word-break:keep-all}
.install ol li+li{margin-top:2px}
.install .solid{margin-top:4px}
.install .row2{display:flex;justify-content:flex-end;margin-top:8px}
.install .later{min-height:40px;padding:0 4px;border:0;background:none;font-size:.875rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;margin-top:18px;padding:0;border:0;background:none;font-size:.875rem;color:var(--ink-soft)}

/* Sunday */
.rest-list{list-style:none;margin:0;padding:0}
.rest-list li{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule)}
.rest-list li:last-child{border-bottom:0}
.rest-list .w{width:1.5rem;font-size:.8125rem;color:var(--ink-soft)}
.rest-list .r{flex:1;font-family:var(--font-read);font-size:1.0625rem}
.rest-list .s{font-size:.8125rem;color:var(--ink-soft)}
.rest-list .s.done{color:var(--leaf);font-weight:600}

.credits{padding:8px var(--gutter) 22px;font-size:.75rem;line-height:1.7;color:var(--ink-soft);word-break:keep-all}
.credits p{margin:0 0 6px}

/* bottom action */
.dock{position:sticky;bottom:0;padding:12px var(--gutter) 14px;background:linear-gradient(to top,var(--paper) 72%,transparent)}
.read-btn{width:100%;height:54px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--leaf);border-radius:16px;background:var(--leaf);color:var(--on-leaf);font-size:1.0625rem;font-weight:600;letter-spacing:-0.01em}
.read-btn svg{width:20px;height:20px;display:none}
.read-btn[aria-pressed="true"]{background:var(--leaf-wash);color:var(--leaf)}
.read-btn[aria-pressed="true"] svg{display:block}
.read-btn[aria-pressed="true"] svg path{stroke-dasharray:24;stroke-dashoffset:0;animation:draw .28s ease-out}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.read-btn[aria-pressed="true"] svg path{animation:none}}
[hidden]{display:none!important}
.status{padding:60px var(--gutter);color:var(--ink-soft)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn" id="prev" type="button" aria-label="전날">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="date" id="dateLabel" aria-live="polite"></div>
    <button class="icon-btn" id="next" type="button" aria-label="다음 날">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="icon-btn size-btn" id="size" type="button" aria-label="글자 크기 바꾸기"><span class="a">가</span><span class="b">가</span></button>
    <button class="icon-btn" id="acctBtn" type="button" aria-label="내 정보">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.3 3.8-5 7-5s5.8 1.7 7 5"/></svg>
    </button>
  </header>
  <nav class="week" id="week" aria-label="이번 주 본문"></nav>
  <main id="main"><p class="status">불러오는 중입니다.</p></main>
  <footer class="credits">

  /* ---------- passage markup ----------
     The HTML from the API is rebuilt element by element: only paragraph, heading,

  var seq = 0;
  function hasClass(n, list) {

  var HEAD = ['s', 's1', 's2', 's3', 's4', 'ms', 'ms1', 'ms2', 'ms3', 'yv-h'];

  function render_passage(html, key) {

        if (n.nodeType === 3) {

            st.texts[st.v] = (st.texts[st.v] || '') + t;

        }
        if (n.nodeType !== 1) { return; }
        var tag = n.tagName;

          var v = parseInt(n.getAttribute('v') || '', 10);
          if (v) { st.v = String(v); }
          inline(n, dest, notes);
          return;
        }
        if (n.classList.contains('yv-vlbl')) { dest.appendChild(el('span', 'vn', n.textContent.trim())); return; }
        if (n.classList.contains('yv-n')) {
          st.fn += 1;
          var fr = n.querySelector('.fr'), ft = n.querySelector('.ft');
          var id = 'fn-' + st.id + '-' + st.fn;
          var b = el('button', 'fn', String(st.fn)); b.type = 'button';
          b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-controls', id);
          b.setAttribute('aria-label', '각주 ' + st.fn + ' 보기');
          dest.appendChild(b);
          notes.push({ id: id, btn: b, fr: fr ? fr.textContent.trim() : '', ft: (ft || n).textContent.trim() });
          return;
        }
        if (tag === 'BR') { dest.appendChild(el('br')); return; }
        inline(n, dest, notes);
      });
    }

    function place(node, notes) {
      out.appendChild(node);
      notes.forEach(function (x) {
        var box = el('div', 'note'); box.id = x.id; box.hidden = true; box.setAttribute('role', 'note');
        if (x.fr) { box.appendChild(el('b', null, x.fr)); }

        x.btn.addEventListener('click', function () {

      if (n.nodeType === 3) {

        hasClass(n, ['p', 'm', 'nb', 'd', 'b', 'pc', 'pr', 'cls']);
      var childBlocks = Array.prototype.some.call(n.children, function (c) { return c.tagName === 'DIV' || c.tagName === 'P'; });
      if (!known && childBlocks) { Array.prototype.forEach.call(n.childNodes, block); return; }

      if (hasClass(n, HEAD)) { node = el('h4', 'sh'); }
      else if (hasClass(n, REFS)) { node = el('p', 'r'); }
      else if (n.classList.contains('d')) { node = el('p', 'd'); }
      else if (n.classList.contains('b')) { out.appendChild(el('div', 'b')); return; }
      else if (hasClass(n, POETRY)) {

      inline(n, node, notes);

      place(node, notes);

    return { node: out, texts: st.texts };

    installBody(box);
    if (!ENV.kakao) {
      box.appendChild(el('p', 'hint', '설치한 뒤에는 ' + (ENV.mobile ? '홈 화면에 생긴' : '설치된') + ' 앱을 열어 그 안에서 로그인해 주세요.'));
    }
    d.appendChild(box);
    return d;
  }

  /* ---------- account ---------- */
  function renderAccount() {
    view.token += 1;
    var main = document.getElementById('main');
    main.textContent = '';
    document.getElementById('dock').hidden = true;
    var hero = el('section', 'hero');
    hero.appendChild(el('h1', null, '내 정보'));
    var back = el('button', 'back', '오늘 본문으로 돌아가기'); back.type = 'button';
    back.addEventListener('click', function () { go(current); });
    hero.appendChild(back);
    main.appendChild(hero);
    if (!standalone()) {
      var si = section('write', '앱으로 설치');
      si.appendChild(installCard(false));
      si.lastChild.style.marginTop = '0';
      main.appendChild(si);
    }

    if (!isMember()) {
      var s0 = section('write', signedIn() ? '교인 등록' : '로그인');
      s0.appendChild(gateCard('등록하면 나눔과 질문을 함께 보고, 앱에서 본문을 읽을 수 있습니다.'));
      if (signedIn()) {
        var so0 = el('button', 'btn', '로그아웃'); so0.type = 'button'; so0.style.marginTop = '14px';
        so0.addEventListener('click', signOutTo);
        s0.appendChild(so0);
      }
      main.appendChild(s0);
      window.scrollTo(0, 0);
      return;
    }

    var s1 = section('write', '나눔에 보이는 이름');
    var nf = el('form');
    var fl = el('div', 'field'), lb = el('label', 'sr', '이름'), inp = el('input');
    inp.id = 'myName'; lb.htmlFor = 'myName'; inp.maxLength = 20; inp.value = acct.me.name || '';
    fl.appendChild(lb); fl.appendChild(inp);
    var nb = el('button', 'btn', '이름 저장'); nb.type = 'submit';
    var nm = el('p', 'msg'); nm.setAttribute('role', 'status');
    nf.appendChild(fl); nf.appendChild(nb); nf.appendChild(nm);
    nf.addEventListener('submit', function (ev) {
      ev.preventDefault(); nm.className = 'msg'; nm.textContent = '';
      sb.rpc('set_my_name', { p_name: inp.value }).then(function (r) {
        var d = r.data || {};
        if (r.error || !d.ok) { nm.textContent = JOIN_ERRORS[d.error] || '저장하지 못했습니다.'; return; }
        acct.me.name = inp.value.trim(); nm.className = 'msg ok'; nm.textContent = '저장했습니다.';
      });
    });
    s1.appendChild(nf);
    main.appendChild(s1);

    var s2 = section('write', '계정');
    var row = el('div', 'acct-actions');
    var so = el('button', 'btn', '로그아웃'); so.type = 'button';
    so.addEventListener('click', signOutTo);
    var lv = el('button', 'btn'); lv.type = 'button';
    twoStepDelete(lv, '탈퇴하고 내 글 모두 지우기', function () {
      sb.rpc('leave_church').then(function (r) {
        if (r.error || !(r.data && r.data.ok)) { lv.disabled = false; return; }
        mem.read = {}; save();
        signOutTo();
      });
    });
    row.appendChild(so); row.appendChild(lv);
    s2.appendChild(row);
    s2.appendChild(el('p', 'hint', '탈퇴하면 교인 등록, 남긴 나눔과 질문과 답글, 읽음 표시가 바로 지워지고 되돌릴 수 없습니다.'));
    main.appendChild(s2);

    if (isAdmin()) { renderAdmin(main); }
    window.scrollTo(0, 0);
  }
  function renderAdmin(main) {
    var s3 = section('write', '교회 코드 바꾸기');
    var cf = el('form');
    var fl = el('div', 'field'), lb = el('label', 'sr', '새 교회 코드'), inp = el('input');
    inp.id = 'newCode'; lb.htmlFor = 'newCode'; inp.maxLength = 30; inp.autocomplete = 'off'; inp.placeholder = '4자에서 30자';
    fl.appendChild(lb); fl.appendChild(inp);
    var cb = el('button', 'btn', '코드 바꾸기'); cb.type = 'submit';
    var cm = el('p', 'msg'); cm.setAttribute('role', 'status');
    cf.appendChild(fl); cf.appendChild(cb); cf.appendChild(cm);
    cf.addEventListener('submit', function (ev) {
      ev.preventDefault(); cm.className = 'msg'; cm.textContent = '';
      sb.rpc('admin_set_join_code', { p_code: inp.value }).then(function (r) {
        var d = r.data || {};
        if (r.error || !d.ok) { cm.textContent = d.error === 'bad_code' ? '코드는 4자에서 30자로 정해 주세요.' : '바꾸지 못했습니다.'; return; }
        inp.value = ''; cm.className = 'msg ok'; cm.textContent = '바꿨습니다. 이미 등록한 교인은 그대로이고, 새로 등록하는 사람만 새 코드를 씁니다.';
      });
    });
    s3.appendChild(cf);
    main.appendChild(s3);

    var s4 = section('write', '교인 명단');
    var ul = el('ul', 'member-list');
    s4.appendChild(ul);
    main.appendChild(s4);
    function draw() {
      sb.from('members').select('user_id,name,role,status,joined_at').order('joined_at', { ascending: true }).then(function (r) {
        ul.textContent = '';
        if (r.error) { ul.appendChild(el('li', null, '명단을 불러오지 못했습니다.')); return; }
        r.data.forEach(function (m) {
          var li = el('li');
          var n = el('span', 'n', m.name);
          li.appendChild(n);
          var st = (m.role === 'admin' ? '관리자 · ' : '') + (m.status === 'blocked' ? '이용 중지' : (new Date(m.joined_at).getMonth() + 1) + '월 ' + new Date(m.joined_at).getDate() + '일 등록');
          li.appendChild(el('span', 's', st));
          if (m.user_id !== myId()) {
            var b = el('button', null, m.status === 'blocked' ? '다시 허용' : '이용 중지'); b.type = 'button';
            b.addEventListener('click', function () {
              b.disabled = true;
              sb.rpc('admin_update_member', { p_user: m.user_id, p_status: m.status === 'blocked' ? 'active' : 'blocked' }).then(draw);
            });
            li.appendChild(b);
          } else { li.appendChild(el('span', 's', '나')); }
          ul.appendChild(li);
        });
      });
    }
    draw();
  }

  function renderReading(day) {
    var main = document.getElementById('main');
    main.textContent = '';

    var hero = el('section', 'hero');
    if (installCardWanted()) { hero.appendChild(installCard(true)); hero.lastChild.style.margin = '0 0 22px'; }
    hero.appendChild(el('p', 'section-name', day.section));
    hero.appendChild(el('h1', null, day.ref));
    var pr = el('div', 'progress');
    var bar = el('div', 'bar'); var fill = el('i'); fill.style.width = (day.n / plan.meta.totalDays * 100).toFixed(2) + '%';
    bar.appendChild(fill); pr.appendChild(bar);
    pr.appendChild(el('span', null, plan.meta.totalDays + '일 가운데 ' + day.n + '일째'));
    hero.appendChild(pr);
    var tog = el('p', 'together'); tog.id = 'together'; tog.setAttribute('aria-live', 'polite');
    hero.appendChild(tog);
    main.appendChild(hero);

    var g = el('section', 'guide');
    g.appendChild(el('h2', null, day.title));
    var body = el('div', 'read');
    day.story.forEach(function (p) { body.appendChild(el('p', null, p)); });
    g.appendChild(body);
    if (day.refs && day.refs.length) {
      var rf = el('p', 'refs', '참고한 책 ');
      day.refs.forEach(function (r, i) {
        if (i) { rf.appendChild(document.createTextNode(', ')); }
        rf.appendChild(document.createTextNode(r.author + ' '));
        rf.appendChild(el('i', null, '『' + r.title + '』'));
      });
      g.appendChild(rf);
    }
    main.appendChild(g);

    var sc = el('section', 'scripture'); sc.id = 'scripture';
    var head = el('div', 'scripture-head');
    head.appendChild(el('h2', 'label', '본문'));
    sc.appendChild(head);
    var inv = el('div', 'invite');
    inv.appendChild(el('p', 'lead', '성경책을 펴고 ' + day.ref + '을 읽어 주세요.'));
    inv.appendChild(el('p', 'sub', '가능하면 성경책을 직접 펴서 읽기를 권합니다. 성경이 곁에 없을 때는 앱에서 현대인의 성경으로 읽을 수 있습니다.'));
    var tg = el('button', 'text-btn'); tg.type = 'button';
    inv.appendChild(tg);
    sc.appendChild(inv);
    var wrap = el('div'); wrap.id = 'textBody';
    if (!isMember()) {
      wrap.appendChild(el('div', 'passage'));
      wrap.lastChild.appendChild(gateCard('앱 안의 본문은 교인 등록을 한 분께만 보입니다.', true));
    } else if (day.chapters.length > 1) {
      var same = day.chapters.every(function (c) { return c.book === day.chapters[0].book; });
      var tabs = el('div', 'tabs'); tabs.id = 'tabs';
      tabs.setAttribute('role', 'group'); tabs.setAttribute('aria-label', '장 고르기');
      day.chapters.forEach(function (c, i) {
        var b = el('button', 'tab', same ? c.ch + unit(c) : chapterName(c)); b.type = 'button';
        b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', function () { if (chapterIndex(day) !== i) { pick(day, i, false); } });
        tabs.appendChild(b);
      });
      wrap.appendChild(tabs);
    }
    var host = el('div', 'passage'); host.id = 'passage'; host.setAttribute('aria-live', 'polite');
    if (isMember()) { wrap.appendChild(host); }
    sc.appendChild(wrap);
    syncTextToggle = function () {
      wrap.hidden = !mem.textOpen;
      tg.textContent = mem.textOpen ? '앱 본문 접기' : '앱에서 읽기';
      tg.setAttribute('aria-expanded', String(!!mem.textOpen));
    };
    tg.setAttribute('aria-controls', 'textBody');
    tg.addEventListener('click', function () {
      mem.textOpen = !mem.textOpen; save(); syncTextToggle();
      if (mem.textOpen && isMember() && !host.firstChild) { showPassage(day, false); }
    });
    syncTextToggle();
    main.appendChild(sc);

    var k = section('key', '눈여겨볼 절');
    var kb = el('div'); kb.id = 'keyBody'; k.appendChild(kb);
    main.appendChild(k);
    fillKey(day);

    var q = section('ask', '나눔 질문');
    var qb = el('div', 'read'); qb.appendChild(el('p', null, day.question)); q.appendChild(qb);
    main.appendChild(q);

    if (day.extra) {
      var x = el('section', 'extra');
      x.appendChild(el('h2', 'label', '읽을거리'));
      x.appendChild(el('h3', null, day.extra.title));
      var xb = el('div', 'read'); xb.appendChild(el('p', null, day.extra.body)); x.appendChild(xb);
      var src = el('p', 'src', '출처 ');
      day.extra.sources.forEach(function (s, i) {
        if (i) { src.appendChild(document.createTextNode(', ')); }
        src.appendChild(link(s.label, s.url));
      });
      x.appendChild(src);
      main.appendChild(x);
    }

    if (isMember()) {
      main.appendChild(postArea('share', '한 줄 나눔', '오늘 읽으며 마음에 남은 것을 적어 주세요', '나눔 남기기'));
      main.appendChild(postArea('question', '궁금한 것 묻기', '본문을 읽다가 궁금한 점을 적어 주세요', '질문 남기기'));
      refreshPosts();
      showTogether();
    } else {
      var gs = section('write', '나눔과 질문');
      gs.appendChild(gateCard('함께 읽는 교인들의 나눔과 질문은 교인 등록을 한 분께만 보입니다.'));
      main.appendChild(gs);
    }

    if (mem.textOpen && isMember()) { showPassage(day, false); }
  }

  /* ---------- Sunday ---------- */
  function renderSunday() {
    var main = document.getElementById('main');
    main.textContent = '';
    var hero = el('section', 'hero');
    hero.appendChild(el('p', 'section-name', '주일'));
    hero.appendChild(el('h1', null, '오늘은 통독을 쉽니다'));
    main.appendChild(hero);

    var g = el('section', 'guide');
    var body = el('div', 'read');
    body.appendChild(el('p', null, '예배에서 만나요. 밀린 날이 있어도 괜찮습니다. 내일은 내일의 본문으로 함께 읽습니다.'));
    g.appendChild(body);
    main.appendChild(g);

    var wk = section('rest', '이번 주에 읽은 본문');
    var ul = el('ul', 'rest-list');
    var d = parse(current);
    for (var i = 6; i >= 1; i--) {
      var x = new Date(d); x.setDate(d.getDate() - i);
      var s = iso(x), day = byDate[s];
      if (!day || day.type === 'sunday') { continue; }
      var li = el('li');
      li.appendChild(el('span', 'w', WD[x.getDay()]));
      li.appendChild(el('span', 'r', day.ref));
      li.appendChild(el('span', 's' + (mem.read[s] ? ' done' : ''), mem.read[s] ? '읽음' : '아직'));
      ul.appendChild(li);
    }
    wk.appendChild(ul);
    main.appendChild(wk);

    var nx = section('rest', '내일의 본문');
    var t = new Date(d); t.setDate(d.getDate() + 1);
    var nd = byDate[iso(t)];
    var ref = nd ? nd.ref : plan.meta.nextAfter.ref;
    var nb = el('div', 'read'); nb.appendChild(el('p', null, ref)); nx.appendChild(nb);
    main.appendChild(nx);
  }

  /* ---------- shell ---------- */
  function syncRead() {
    var btn = document.getElementById('readBtn');
    btn.setAttribute('aria-pressed', String(!!mem.read[current]));
  }
  function render() {
    if (!isMember()) { renderIntro(); return; }
    setChrome(true);
    var day = byDate[current];
    view.token += 1;
    document.getElementById('dateLabel').textContent = longDate(current);
    var i = order.indexOf(current);
    document.getElementById('prev').disabled = i <= 0;
    document.getElementById('next').disabled = i >= order.length - 1;
    renderWeek();
    var dock = document.getElementById('dock');
    if (day.type === 'sunday') { dock.hidden = true; renderSunday(); }
    else { dock.hidden = false; renderReading(day); syncRead(); }
  }
  function go(s, keepScroll) {
    if (!byDate[s]) { return; }
    current = s;
    try { window.history.replaceState(null, '', '#' + hashFor(s)); } catch (e) { window.location.hash = hashFor(s); }
    render();
    if (!keepScroll) { window.scrollTo(0, 0); }
  }
  function step(n) {
    var i = order.indexOf(current) + n;
    if (i >= 0 && i < order.length) { go(order[i]); }
  }

  function start() {
    plan.days.forEach(function (d) { byDate[d.date] = d; order.push(d.date); });
    var today = iso(new Date());
    var first = returnDay() || fromHash() || (byDate[today] ? today : order[0]);
    document.getElementById('prev').addEventListener('click', step.bind(null, -1));
    document.getElementById('next').addEventListener('click', step.bind(null, 1));
    document.getElementById('size').addEventListener('click', function () {
      mem.size = (mem.size + 1) % SIZES.length; save(); applySize();
    });
    document.getElementById('readBtn').addEventListener('click', toggleRead);
    document.getElementById('acctBtn').addEventListener('click', renderAccount);
    window.addEventListener('hashchange', function () {
      var s = fromHash(); if (s && s !== current) { go(s); }
    });
    go(first, true);
  }

  load(); applySize();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  var authReady = initAuth().catch(function () {});
  fetch('data/2027.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) { throw new Error('plan'); } return r.json(); })
    .then(function (p) { plan = p; return authReady; })
    .then(function () {
      start();
      syncReadsFromServer().then(function () { if (byDate[current] && byDate[current].type !== 'sunday') { syncRead(); } renderWeek(); });
    })
    .catch(function () {
      var main = document.getElementById('main');
      main.textContent = '';
      main.appendChild(el('p', 'status', '자료를 불러오지 못했습니다. 화면을 새로 고쳐 주세요.'));
    });
})();
</script>
</body>
